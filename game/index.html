<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmarina — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2a3a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #minimap {
    position: fixed; top: 118px; right: 16px; width: 200px; height: 150px;
    border: 2px solid rgba(255, 210, 63, 0.8); border-radius: 6px;
    background: #1d2b33; z-index: 5;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmarina: an open-world crime game. Walk and drive around the city, steal cars, run missions for Mara, and stay ahead of the police."></canvas>
<canvas id="minimap" width="200" height="150" aria-label="Minimap of Solmarina"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
